# 内部系统地址配置
# 填入实际的内部系统 URL，skill 会自动读取
# 此文件包含敏感信息，不要提交到版本控制
#
# 这三个地址是全局固定的，所有平台共用（无需按平台分组）：
#   - sso_login:         SSO 统一认证登录地址
#   - product_composition: 产品构成查询地址（查询平台微服务清单）
#   - component_api:       组件接口查询地址（查询微服务 API 契约）

# SSO 统一认证登录地址
# 所有内部系统的认证入口，访问需登录的页面时自动跳转到此地址
sso_login: ""

# 产品构成查询地址
# 在此系统中搜索平台名称，进入产品详情页查看"产品构成"模块
# "产品构成"模块列出该平台包含的所有微服务
product_composition: ""

# 组件接口查询地址
# 在此系统中搜索微服务名称，查看各微服务的 API 契约（Feign 接口 / REST API）
component_api: ""
