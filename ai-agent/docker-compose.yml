services:
  postgres:
    image: postgres:16-alpine
    container_name: enterprise-knowledge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: enterprise_knowledge_base
      POSTGRES_USER: knowledge_user
      POSTGRES_PASSWORD: knowledge_password
      TZ: Asia/Shanghai
    ports:
      - "7092:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge_user -d enterprise_knowledge_base"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
